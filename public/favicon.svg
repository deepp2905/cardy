<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- cardy favicon: the card's EMV chip, no field behind it.
       Geometry follows ChipMark (src/card/Card.tsx) but is redrawn with much
       heavier traces — the card's 1.2px strokes on a 44x34 box vanish entirely
       once a browser scales this down to a 16px tab.

       Transparent background, so the chip is the whole silhouette. That means
       the gold has to carry legibility unaided: the traces are darkened (the
       purple field used to supply the surrounding contrast) and the body keeps
       a full-strength outline so the shape stays defined against a light tab
       strip, where mid-gold on near-white is the weakest pairing. -->
  <defs>
    <!-- Lifted a step brighter than the card's own chip gradient. On the card
         the gold sits on a saturated colour; here it may sit on a near-black
         tab strip, where the dark traces and outline consume most of a 16px
         square and the original ramp went muddy. Same hue, more luminance. -->
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5ecc4" />
      <stop offset="0.55" stop-color="#dcc887" />
      <stop offset="1" stop-color="#c0a25e" />
    </linearGradient>
  </defs>

  <!-- Chip body: 56x44, near-full-bleed now that no field frames it. The 2px
       inset keeps the outline stroke from clipping at the viewBox edge. -->
  <g transform="translate(4 10)">
    <rect width="56" height="44" rx="7.5" fill="url(#chip)" />
    <rect
      width="56"
      height="44"
      rx="7.5"
      fill="none"
      stroke="rgba(52,38,10,0.85)"
      stroke-width="2.5"
    />
    <!-- Contact traces: two shoulders down from the top edge, two up from the
         bottom, one bar across the middle — the card's own topology. Stroke
         3.5 and near-opaque; at 16px this is the difference between a legible
         chip and a gold blob. Butt caps so the shoulders meet the body edge
         squarely and stay crisp when downscaled. -->
    <path
      d="M19 0v12.5a5 5 0 0 1-5 5H0M37 0v12.5a5 5 0 0 0 5 5h14M19 44V31.5a5 5 0 0 0-5-5H0M37 44V31.5a5 5 0 0 1 5-5h14M19 22h18"
      fill="none"
      stroke="rgba(52,38,10,0.85)"
      stroke-width="3.5"
    />
  </g>
</svg>
