<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cardy: design your card</title>
    <script>
      // Stamped pre-paint so there is no flash of the wrong theme. Dark is the
      // default: the cards are the whole point and they read best on a dark
      // surface, so we don't follow prefers-color-scheme. A stored choice from
      // the toggle always wins.
      (function () {
        var t = localStorage.getItem("cardy-theme");
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
      })();
    </script>
    <script>
      // Microsoft Clarity — session analytics. The vendor ships this as a
      // minified IIFE with seven single-letter params; unpacked here because it
      // is the only opaque block in the file. Behaviour is identical: queue any
      // clarity() calls made before the tag lands, then load it async so it
      // never blocks paint.
      (function () {
        var PROJECT_ID = "xswvqmri1h";
        window.clarity =
          window.clarity ||
          function () {
            (window.clarity.q = window.clarity.q || []).push(arguments);
          };
        var tag = document.createElement("script");
        tag.async = 1;
        tag.src = "https://www.clarity.ms/tag/" + PROJECT_ID;
        var first = document.getElementsByTagName("script")[0];
        first.parentNode.insertBefore(tag, first);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
