<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cardy: design your card</title>
    <script>
      // Stamped pre-paint so there is no flash of the wrong theme. Dark is the
      // default: the cards are the whole point and they read best on a dark
      // surface, so we don't follow prefers-color-scheme. A stored choice from
      // the toggle always wins.
      (function () {
        var t = localStorage.getItem("cardy-theme");
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
      })();
    </script>
    <script>
      // Microsoft Clarity — session analytics. The vendor ships this as a
      // minified IIFE with seven single-letter params; unpacked here because it
      // is the only opaque block in the file. Calls are queued immediately, but
      // the vendor download waits until load + idle so it cannot compete with
      // the app's first render for bandwidth or main-thread time.
      (function () {
        var PROJECT_ID = "xswvqmri1h";
        window.clarity =
          window.clarity ||
          function () {
            (window.clarity.q = window.clarity.q || []).push(arguments);
          };
        function loadClarity() {
          var tag = document.createElement("script");
          tag.async = 1;
          tag.src = "https://www.clarity.ms/tag/" + PROJECT_ID;
          document.head.appendChild(tag);
        }
        function scheduleClarity() {
          if ("requestIdleCallback" in window) {
            window.requestIdleCallback(loadClarity, { timeout: 2000 });
          } else {
            window.setTimeout(loadClarity, 0);
          }
        }
        if (document.readyState === "complete") scheduleClarity();
        else window.addEventListener("load", scheduleClarity, { once: true });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
