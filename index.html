<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cardy</title>
    <script>
      // Stamped pre-paint so there is no flash of the wrong theme. Dark is the
      // default: the cards are the whole point and they read best on a dark
      // surface, so we don't follow prefers-color-scheme. A stored choice from
      // the toggle always wins.
      (function () {
        var t = localStorage.getItem("cardy-theme");
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
      })();
    </script>
    <script type="text/javascript">
      // Microsoft Clarity — session analytics. Loads async so it never blocks paint.
      (function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;
        t.src = "https://www.clarity.ms/tag/" + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", "xswvqmri1h");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
